name: Google Sheet Auto Sync Staging

on:
  schedule:
    # GitHub scheduled workflows only run from the default branch.
    # This workflow lives on main but only calls the staging cron route.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-staging-sync:
    name: Trigger staging Google Sheet sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call staging cron route
        env:
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          STAGING_APP_URL: https://dmc-pm-staging.vercel.app
        run: |
          set -Eeuo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret STAGING_CRON_SECRET. Set it to the same value as Vercel CRON_SECRET for staging."
            echo "Skipping trigger so scheduled workflow does not fail repeatedly before the secret is configured."
            exit 0
          fi

          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${STAGING_APP_URL}/api/cron/google-sheet-sync")"

          echo "HTTP ${status_code}"
          cat "$response_file"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            exit 1
          fi

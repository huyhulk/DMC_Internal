name: Staging CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_NAME: 'DMC Production Manager (Staging)'
      NEXT_PUBLIC_APP_URL: 'https://dmc-pm-staging.vercel.app'
      NEXT_PUBLIC_ENV: 'staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrate-staging:
    name: Apply Migrations to Staging DB
    runs-on: ubuntu-latest
    needs: test
    # Only run on direct push to staging (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # staging_init.sql đã tạo schema thực tế nhưng không đăng ký migration history.
      # Bước này đảm bảo migrations 001-006 được đánh dấu "đã apply" (idempotent)
      # để supabase db push bỏ qua chúng và chỉ chạy migration mới (007+).
      #
      # QUAN TRỌNG — version dùng SHORT format (001, 002...) vì Supabase CLI v2 đọc
      # tên file 001_initial_schema.sql → version '001' (chỉ numeric prefix).
      #
      # QUAN TRỌNG — mỗi lệnh phải là 1 statement riêng. supabase db query dùng
      # extended query protocol — PostgreSQL không cho phép multi-statement trong
      # 1 prepared statement (SQLSTATE 42601).
      - name: Ensure migration history for legacy migrations
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          echo "CREATE SCHEMA IF NOT EXISTS supabase_migrations;" > /tmp/m0.sql
          echo "CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text NOT NULL PRIMARY KEY, name text DEFAULT '', statements text[]);" > /tmp/m1.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('001','001_initial_schema') ON CONFLICT (version) DO NOTHING;" > /tmp/m2.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('002','002_normalize_workshop_codes') ON CONFLICT (version) DO NOTHING;" > /tmp/m3.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('003','003_production_rls_strict') ON CONFLICT (version) DO NOTHING;" > /tmp/m4.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('004','004_fix_empty_workspace_rls') ON CONFLICT (version) DO NOTHING;" > /tmp/m5.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('005','005_report_rpcs') ON CONFLICT (version) DO NOTHING;" > /tmp/m6.sql
          echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('006','006_add_overtime_shift') ON CONFLICT (version) DO NOTHING;" > /tmp/m7.sql
          for f in /tmp/m0.sql /tmp/m1.sql /tmp/m2.sql /tmp/m3.sql /tmp/m4.sql /tmp/m5.sql /tmp/m6.sql /tmp/m7.sql; do
            supabase db query --db-url "$DB_URL" -f "$f"
          done

      # STAGING_DB_URL phải là direct connection URL (port 5432):
      #   postgresql://postgres:[password]@db.[project-ref].supabase.co:5432/postgres
      # KHÔNG dùng transaction pooler (port 6543) — supabase db push dùng extended query
      # protocol (prepared statement), PostgreSQL reject multi-statement → SQLSTATE 42601.
      - name: Apply migrations to staging
        run: supabase db push --db-url "${{ secrets.STAGING_DB_URL }}"

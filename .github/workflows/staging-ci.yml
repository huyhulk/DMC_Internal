name: Staging CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      sync_main_data_to_staging:
        description: 'Type SYNC_STAGING to replace staging core data from production/main'
        required: false
        type: string

jobs:
  test:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_NAME: 'DMC Production Manager (Staging)'
      NEXT_PUBLIC_APP_URL: 'https://dmc-pm-staging.vercel.app'
      NEXT_PUBLIC_ENV: 'staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrate-staging:
    name: Apply Migrations to Staging DB
    runs-on: ubuntu-latest
    needs: test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Only run on direct push to staging (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # STAGING_DB_URL phải là direct connection URL (port 5432):
      #   postgresql://postgres:[password]@db.[project-ref].supabase.co:5432/postgres
      # KHÔNG dùng transaction pooler (port 6543) — supabase db push dùng extended query
      # protocol (prepared statement), PostgreSQL reject multi-statement → SQLSTATE 42601.
      #
      # supabase db push là idempotent: chỉ chạy migrations chưa có trong
      # supabase_migrations.schema_migrations. Fresh staging DB cũng OK vì
      # migration 001 đã được fix đúng schema (lowercase table, UPPERCASE columns).
      - name: Apply pending migrations to staging
        run: supabase db push --db-url "${{ secrets.STAGING_DB_URL }}"

  sync-main-data-to-staging:
    name: Replace staging core data from production/main
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && github.event.inputs.sync_main_data_to_staging == 'SYNC_STAGING'
    timeout-minutes: 30

    steps:
      - name: Validate confirmation and branch
        run: |
          set -Eeuo pipefail

          if [ "${{ github.event.inputs.sync_main_data_to_staging }}" != "SYNC_STAGING" ]; then
            echo "Confirmation failed. Type exactly SYNC_STAGING to proceed."
            exit 1
          fi

          if [ "${{ github.ref }}" != "refs/heads/staging" ]; then
            echo "Refusing to continue: workflow must run from refs/heads/staging."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify source and target projects
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -Eeuo pipefail

          parse_url() {
            python3 -c 'import os, sys, urllib.parse; u=urllib.parse.urlparse(os.environ[sys.argv[1]]); print("|".join([(u.hostname or "").lstrip("@"), str(u.port or ""), (u.path or "").lstrip("/"), u.username or ""]))' "$1"
          }

          prod_parts="$(parse_url PROD_DB_URL)"
          staging_parts="$(parse_url STAGING_DB_URL)"

          prod_host="${prod_parts%%|*}"
          staging_host="${staging_parts%%|*}"

          echo "Production host: ${prod_host}"
          echo "Staging host: ${staging_host}"

          if [ -z "${prod_host}" ] || [ -z "${staging_host}" ]; then
            echo "Missing database host in one of the DB URLs."
            exit 1
          fi

          if [ "${prod_parts}" = "${staging_parts}" ]; then
            echo "Refusing to continue: production and staging parsed DB targets are identical."
            exit 1
          fi

          if [ "${PROD_DB_URL}" = "${STAGING_DB_URL}" ]; then
            echo "Refusing to continue: production and staging DB URL secrets are identical."
            exit 1
          fi

          # Supabase pooler URLs can share the same pooler host. The project ref is
          # embedded in the parsed URL parts (commonly the username), so validate
          # against the parsed target identity rather than host only.
          case "${prod_parts}" in
            *hzuyucyxyohppxfwresq*) ;;
            *) echo "Unexpected production target identity."; exit 1 ;;
          esac

          case "${staging_parts}" in
            *vfzjweyzwjczrxphnvaa*) ;;
            *) echo "Unexpected staging target identity."; exit 1 ;;
          esac

          write_conninfo() {
            python3 - "$1" "$2" "$3" <<'PY'
          import os
          import sys
          import urllib.parse

          url = os.environ[sys.argv[1]]
          out = sys.argv[2]
          project_ref = sys.argv[3]
          u = urllib.parse.urlparse(url)

          def esc(value):
              return (value or '').replace('\\', '\\\\').replace("'", "\\'")

          host = (u.hostname or '').lstrip('@')
          port = str(u.port or '5432')
          dbname = (u.path or '/postgres').lstrip('/') or 'postgres'
          user = urllib.parse.unquote(u.username or '')
          password = urllib.parse.unquote(u.password or '')

          if ('pooler.supabase.com' in host) or host.startswith('aws-'):
              user = f'postgres.{project_ref}'

          if not host or not user:
              raise SystemExit('Invalid database URL: missing host or user')

          conninfo = ' '.join([
              f"host='{esc(host)}'",
              f"port='{esc(port)}'",
              f"dbname='{esc(dbname)}'",
              f"user='{esc(user)}'",
              f"password='{esc(password)}'",
              "sslmode='require'",
          ])

          with open(out, 'w', encoding='utf-8') as f:
              f.write(conninfo)
          PY
            chmod 600 "$2"
          }

          # Write libpq keyword/value connection strings so psql/pg_dump use TCP even
          # when a pooler URL contains a leading @ in the parsed hostname.
          # Supabase pooler requires username postgres.<project-ref>.
          write_conninfo PROD_DB_URL /tmp/prod_db.conninfo hzuyucyxyohppxfwresq
          write_conninfo STAGING_DB_URL /tmp/staging_db.conninfo vfzjweyzwjczrxphnvaa

      - name: Verify table availability and capture source counts
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -Eeuo pipefail

          cat >/tmp/counts.sql <<'SQL'
          select 'data' as table_name, count(*) as rows from public.data
          union all select 'Production', count(*) from public."Production"
          union all select 'Norm', count(*) from public."Norm"
          union all select 'Material', count(*) from public."Material"
          union all select 'production_order_status', count(*) from public.production_order_status
          order by table_name;
          SQL

          echo "Production source row counts:"
          psql "$(cat /tmp/prod_db.conninfo)" -v ON_ERROR_STOP=1 -f /tmp/counts.sql | tee /tmp/prod_counts.txt

          echo "Staging pre-sync row counts:"
          psql "$(cat /tmp/staging_db.conninfo)" -v ON_ERROR_STOP=1 -f /tmp/counts.sql | tee /tmp/staging_before_counts.txt

      - name: Dump core data from production/main read-only
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -Eeuo pipefail

          pg_dump "$(cat /tmp/prod_db.conninfo)" \
            --data-only \
            --no-owner \
            --no-privileges \
            --table='public.data' \
            --table='public."Production"' \
            --table='public."Norm"' \
            --table='public."Material"' \
            --table='public.production_order_status' \
            --file=/tmp/main_core_data.sql

          test -s /tmp/main_core_data.sql
          echo "Dump completed. Production was accessed with default_transaction_read_only=on."
          grep -E "^(COPY|INSERT INTO)" /tmp/main_core_data.sql | sed 's/ FROM stdin;//' || true

      - name: Replace staging core data
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -Eeuo pipefail

          psql "$(cat /tmp/staging_db.conninfo)" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          truncate table
            public.production_order_status,
            public."Production",
            public."Material",
            public."Norm",
            public.data
          restart identity;
          commit;
          SQL

          psql "$(cat /tmp/staging_db.conninfo)" -v ON_ERROR_STOP=1 -f /tmp/main_core_data.sql

      - name: Verify staging row counts
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -Eeuo pipefail

          cat >/tmp/counts.sql <<'SQL'
          select 'data' as table_name, count(*) as rows from public.data
          union all select 'Production', count(*) from public."Production"
          union all select 'Norm', count(*) from public."Norm"
          union all select 'Material', count(*) from public."Material"
          union all select 'production_order_status', count(*) from public.production_order_status
          order by table_name;
          SQL

          echo "Staging post-sync row counts:"
          psql "$(cat /tmp/staging_db.conninfo)" -v ON_ERROR_STOP=1 -f /tmp/counts.sql | tee /tmp/staging_after_counts.txt

          prod_counts="$(grep -E '^( data| Material| Norm| Production| production_order_status) ' /tmp/prod_counts.txt | tr -d ' ')"
          staging_counts="$(grep -E '^( data| Material| Norm| Production| production_order_status) ' /tmp/staging_after_counts.txt | tr -d ' ')"

          if [ "${prod_counts}" != "${staging_counts}" ]; then
            echo "Post-sync staging counts do not match production source counts."
            echo "Production counts:"
            echo "${prod_counts}"
            echo "Staging counts:"
            echo "${staging_counts}"
            exit 1
          fi

          echo "Staging row counts match production source counts for all synced tables."

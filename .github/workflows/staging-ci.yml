name: Staging CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_NAME: 'DMC Production Manager (Staging)'
      NEXT_PUBLIC_APP_URL: 'https://dmc-pm-staging.vercel.app'
      NEXT_PUBLIC_ENV: 'staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrate-staging:
    name: Apply Migrations to Staging DB
    runs-on: ubuntu-latest
    needs: test
    # Only run on direct push to staging (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # staging_init.sql đã tạo schema thực tế nhưng không đăng ký migration history.
      # Bước này đảm bảo migrations 001-006 được đánh dấu "đã apply" (idempotent)
      # để supabase db push bỏ qua chúng và chỉ chạy migration mới (007+).
      - name: Ensure migration history for legacy migrations
        run: |
          psql "${{ secrets.STAGING_DB_URL }}" <<'EOF'
          CREATE SCHEMA IF NOT EXISTS supabase_migrations;
          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
            version text NOT NULL PRIMARY KEY,
            name    text,
            hash    text
          );
          INSERT INTO supabase_migrations.schema_migrations (version, name)
          VALUES
            ('001', '001_initial_schema'),
            ('002', '002_normalize_workshop_codes'),
            ('003', '003_production_rls_strict'),
            ('004', '004_fix_empty_workspace_rls'),
            ('005', '005_report_rpcs'),
            ('006', '006_add_overtime_shift')
          ON CONFLICT (version) DO NOTHING;
          EOF

      - name: Apply migrations to staging
        run: supabase db push --db-url "${{ secrets.STAGING_DB_URL }}"
